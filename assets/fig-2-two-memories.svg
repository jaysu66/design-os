<svg viewBox="0 0 1200 840" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', ui-monospace, 'Cascadia Code', 'Roboto Mono', monospace; }
      .h1 { font-weight: 550; letter-spacing: -0.01em; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7" fill="none" stroke="#b4b4b4" stroke-width="1.2"/>
    </marker>
    <marker id="aho" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1.5 L6.5,4.5 L1,7.5" fill="none" stroke="#ff5c00" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#fafafa"/>

  <!-- header -->
  <rect x="64" y="58" width="26" height="10" rx="2" fill="#ff5c00"/>
  <text x="100" y="68" class="mono" font-size="12" letter-spacing="2.5" fill="#9a9a9a">WHY IT GETS BETTER</text>
  <text x="64" y="124" class="h1" font-size="36" fill="#171717">两层会自己积累的记忆</text>
  <text x="64" y="160" font-size="16" fill="#666666">前三层让 agent 这一次做得好；第四层——记忆——让它下一次做得更好。</text>

  <!-- ================= LAYER ①  DESIGN.md ================= -->
  <text x="64" y="222" class="mono" font-size="13" letter-spacing="0.5" fill="#171717">① DESIGN.md</text>
  <text x="176" y="222" font-size="14" fill="#9a9a9a">项目级记忆 · 横向一致</text>

  <!-- DESIGN.md doc card -->
  <g>
    <rect x="64" y="248" width="212" height="168" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="84" y="284" class="mono" font-size="13" fill="#171717">DESIGN.md</text>
    <line x1="84" y1="298" x2="256" y2="298" stroke="#eeeeee" stroke-width="1"/>
    <rect x="84" y="314" width="150" height="7" rx="2" fill="#e2e2e2"/>
    <rect x="84" y="330" width="120" height="7" rx="2" fill="#e8e8e8"/>
    <rect x="84" y="346" width="134" height="7" rx="2" fill="#e8e8e8"/>
    <!-- color tokens: the one orange accent -->
    <rect x="84" y="374" width="16" height="16" rx="3" fill="#171717"/>
    <rect x="106" y="374" width="16" height="16" rx="3" fill="#c9c9c9"/>
    <rect x="128" y="374" width="16" height="16" rx="3" fill="#e6e6e6"/>
    <rect x="150" y="374" width="16" height="16" rx="3" fill="#ff5c00"/>
    <text x="176" y="387" class="mono" font-size="10" fill="#b4b4b4">tokens</text>
  </g>

  <!-- derive arrows -->
  <text x="300" y="326" class="mono" font-size="10" letter-spacing="1" fill="#b4b4b4">推导</text>
  <line x1="292" y1="332" x2="352" y2="332" stroke="#d0d0d0" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- three pages, same structure (coherent) -->
  <g>
    <!-- page tpl repeated: nav + dark title + lines + tiny accent dot at same spot -->
    <g transform="translate(372,248)">
      <rect x="0" y="0" width="172" height="168" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
      <rect x="16" y="16" width="60" height="8" rx="2" fill="#ededed"/>
      <rect x="16" y="40" width="96" height="18" rx="3" fill="#1f1f1f"/>
      <rect x="16" y="70" width="140" height="6" rx="2" fill="#e8e8e8"/>
      <rect x="16" y="84" width="112" height="6" rx="2" fill="#eeeeee"/>
      <rect x="16" y="110" width="46" height="16" rx="4" fill="#ff5c00"/>
      <text x="16" y="152" class="mono" font-size="10" fill="#9a9a9a">首页</text>
    </g>
    <g transform="translate(560,248)">
      <rect x="0" y="0" width="172" height="168" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
      <rect x="16" y="16" width="60" height="8" rx="2" fill="#ededed"/>
      <rect x="16" y="40" width="96" height="18" rx="3" fill="#1f1f1f"/>
      <rect x="16" y="70" width="140" height="6" rx="2" fill="#e8e8e8"/>
      <rect x="16" y="84" width="112" height="6" rx="2" fill="#eeeeee"/>
      <rect x="16" y="110" width="46" height="16" rx="4" fill="#ff5c00"/>
      <text x="16" y="152" class="mono" font-size="10" fill="#9a9a9a">定价页</text>
    </g>
    <g transform="translate(748,248)">
      <rect x="0" y="0" width="172" height="168" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
      <rect x="16" y="16" width="60" height="8" rx="2" fill="#ededed"/>
      <rect x="16" y="40" width="96" height="18" rx="3" fill="#1f1f1f"/>
      <rect x="16" y="70" width="140" height="6" rx="2" fill="#e8e8e8"/>
      <rect x="16" y="84" width="112" height="6" rx="2" fill="#eeeeee"/>
      <rect x="16" y="110" width="46" height="16" rx="4" fill="#ff5c00"/>
      <text x="16" y="152" class="mono" font-size="10" fill="#9a9a9a">仪表盘</text>
    </g>
  </g>
  <text x="948" y="316" font-size="15" fill="#666666">同一份「设计宪法」，</text>
  <text x="948" y="342" font-size="15" fill="#666666">每页都从它推导 —</text>
  <text x="948" y="368" class="h1" font-size="16" fill="#171717">不会东一个风格</text>
  <text x="948" y="392" class="h1" font-size="16" fill="#171717">西一个风格。</text>

  <line x1="64" y1="460" x2="1136" y2="460" stroke="#ededed" stroke-width="1"/>

  <!-- ================= LAYER ②  preferences ================= -->
  <text x="64" y="512" class="mono" font-size="13" letter-spacing="0.5" fill="#171717">② preferences</text>
  <text x="196" y="512" font-size="14" fill="#9a9a9a">跨项目记忆 · 越用越懂你</text>

  <!-- three project correction boxes (stacked) -->
  <g class="mono" font-size="11" fill="#666666">
    <rect x="64" y="548" width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="80" y="573" fill="#666666">项目 A 的纠错</text>
    <rect x="64" y="600" width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="80" y="625" fill="#666666">项目 B 的纠错</text>
    <rect x="64" y="652" width="150" height="40" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="80" y="677" fill="#666666">项目 C 的纠错</text>
  </g>

  <!-- converge to 观察区 -->
  <path d="M214,568 C238,568 236,620 258,620" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>
  <path d="M214,620 L258,620" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>
  <path d="M214,672 C238,672 236,620 258,620" fill="none" stroke="#d0d0d0" stroke-width="1.2" marker-end="url(#ah)"/>

  <rect x="262" y="596" width="118" height="48" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="321" y="617" class="mono" font-size="12" fill="#171717" text-anchor="middle">观察区</text>
  <text x="321" y="633" font-size="10" fill="#9a9a9a" text-anchor="middle">单次记录</text>

  <line x1="380" y1="620" x2="418" y2="620" stroke="#d0d0d0" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- threshold (dashed) -->
  <rect x="420" y="596" width="140" height="48" rx="6" fill="none" stroke="#c0c0c0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="490" y="617" class="mono" font-size="12" fill="#666666" text-anchor="middle">≥ 2 个项目复现</text>
  <text x="490" y="633" font-size="10" fill="#9a9a9a" text-anchor="middle">转正门槛</text>

  <line x1="560" y1="620" x2="598" y2="620" stroke="#171717" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- total preference (emphasis: black border) -->
  <rect x="600" y="594" width="150" height="52" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.4"/>
  <text x="675" y="616" class="mono" font-size="12" fill="#171717" text-anchor="middle">总偏好</text>
  <text x="675" y="633" font-size="10" fill="#9a9a9a" text-anchor="middle">所有项目默认遵守</text>

  <!-- compounding curve (the one orange stroke) -->
  <line x1="812" y1="712" x2="1120" y2="712" stroke="#e5e5e5" stroke-width="1"/>
  <line x1="812" y1="712" x2="812" y2="556" stroke="#e5e5e5" stroke-width="1"/>
  <path d="M820,700 C900,694 980,660 1112,568" fill="none" stroke="#ff5c00" stroke-width="2.2" marker-end="url(#aho)"/>
  <circle cx="820" cy="700" r="3" fill="#ff5c00"/>
  <text x="1120" y="548" class="h1" font-size="16" fill="#171717" text-anchor="end">越用越懂你</text>
  <text x="812" y="732" class="mono" font-size="10" letter-spacing="1" fill="#9a9a9a">用得越久 →</text>

  <text x="64" y="756" font-size="16" fill="#666666">你每纠错一次，它就静默记一条（你零维护）。同类品味跨 ≥2 个项目复现 → 转正成默认。</text>
  <text x="64" y="784" class="h1" font-size="17" fill="#171717">你的审美，第一次变成了可以复利的系统资产。</text>

  <text x="1136" y="816" class="mono" font-size="11" letter-spacing="1.5" fill="#c4c4c4" text-anchor="end">design-os</text>
</svg>
