<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', ui-monospace, 'Cascadia Code', 'Roboto Mono', monospace; }
      .h1 { font-weight: 550; letter-spacing: -0.01em; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1200" height="660" fill="#fafafa"/>

  <!-- header -->
  <rect x="64" y="60" width="26" height="10" rx="2" fill="#ff5c00"/>
  <text x="100" y="70" class="mono" font-size="12" letter-spacing="2.5" fill="#9a9a9a">THE AI LOOK — DIAGNOSED</text>
  <text x="64" y="126" class="h1" font-size="36" fill="#171717">AI 做的界面，为什么都是一张「平均脸」</text>
  <text x="64" y="162" font-size="16" fill="#666666">同一句「做个好看的落地页」，没有参考、没有标准，模型只能吐出训练分布的众数。</text>

  <!-- divider VS -->
  <line x1="600" y1="230" x2="600" y2="600" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="600" cy="410" r="22" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
  <text x="600" y="415" class="mono" font-size="12" letter-spacing="1" fill="#9a9a9a" text-anchor="middle">VS</text>

  <!-- ============ LEFT: no reference → average face ============ -->
  <text x="64" y="228" class="mono" font-size="12" letter-spacing="1.5" fill="#9a9a9a">INPUT ·  无参考 · 裸奔生成</text>

  <!-- stacked identical template wireframes (mushy average) -->
  <g stroke="#cfcfcf" fill="#ffffff">
    <g opacity="0.35" transform="translate(300,300)">
      <rect x="0" y="0" width="210" height="150" rx="6"/>
      <rect x="55" y="22" width="100" height="12" rx="2" fill="#e2e2e2" stroke="none"/>
      <rect x="72" y="42" width="66" height="7" rx="2" fill="#ececec" stroke="none"/>
      <rect x="18" y="82" width="52" height="46" rx="4"/><rect x="79" y="82" width="52" height="46" rx="4"/><rect x="140" y="82" width="52" height="46" rx="4"/>
    </g>
    <g opacity="0.5" transform="translate(280,285)">
      <rect x="0" y="0" width="210" height="150" rx="6"/>
      <rect x="55" y="22" width="100" height="12" rx="2" fill="#e2e2e2" stroke="none"/>
      <rect x="72" y="42" width="66" height="7" rx="2" fill="#ececec" stroke="none"/>
      <rect x="18" y="82" width="52" height="46" rx="4"/><rect x="79" y="82" width="52" height="46" rx="4"/><rect x="140" y="82" width="52" height="46" rx="4"/>
    </g>
    <g opacity="0.9" transform="translate(258,268)">
      <rect x="0" y="0" width="210" height="150" rx="6"/>
      <rect x="55" y="22" width="100" height="12" rx="2" fill="#dedede" stroke="none"/>
      <rect x="72" y="42" width="66" height="7" rx="2" fill="#e8e8e8" stroke="none"/>
      <rect x="18" y="82" width="52" height="46" rx="4"/><rect x="79" y="82" width="52" height="46" rx="4"/><rect x="140" y="82" width="52" height="46" rx="4"/>
    </g>
  </g>
  <text x="64" y="500" class="mono" font-size="11" letter-spacing="1" fill="#b0b0b0">居中标题 + 渐变字 + 三卡 + emoji</text>
  <text x="64" y="548" font-size="16" fill="#666666">训练分布的众数 = 所有网站的平均脸</text>
  <text x="64" y="576" class="h1" font-size="19" fill="#171717">→ 谁都不是。</text>

  <!-- ============ RIGHT: design-os → opinionated output ============ -->
  <text x="660" y="228" class="mono" font-size="12" letter-spacing="1.5" fill="#171717">design-os ·  判断力 + 参考锚点</text>

  <!-- one confident, asymmetric wireframe -->
  <g transform="translate(660,268)">
    <rect x="0" y="0" width="430" height="150" rx="8" fill="#ffffff" stroke="#171717" stroke-width="1.2"/>
    <!-- big display title block (large size, confident) -->
    <rect x="26" y="30" width="150" height="30" rx="3" fill="#171717"/>
    <!-- body lines -->
    <rect x="26" y="74" width="188" height="8" rx="2" fill="#dcdcdc"/>
    <rect x="26" y="92" width="140" height="8" rx="2" fill="#e6e6e6"/>
    <!-- single orange CTA (one accent) -->
    <rect x="26" y="112" width="92" height="26" rx="6" fill="#ff5c00"/>
    <!-- right: framed preview, whitespace, asymmetry -->
    <rect x="270" y="26" width="134" height="98" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <line x1="270" y1="70" x2="404" y2="70" stroke="#ededed" stroke-width="1"/>
  </g>
  <text x="660" y="500" class="mono" font-size="11" letter-spacing="1" fill="#9a9a9a">1px 边框 · 灰阶层级 · 一个强调色</text>
  <text x="660" y="548" font-size="16" fill="#666666">先定参考 → 有主张、有层级的输出</text>
  <text x="660" y="576" class="h1" font-size="19" fill="#171717">→ 记得住。</text>

  <!-- footer signature -->
  <text x="1136" y="636" class="mono" font-size="11" letter-spacing="1.5" fill="#c4c4c4" text-anchor="end">design-os</text>
</svg>
